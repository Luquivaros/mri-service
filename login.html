<body class="login-page">

<div class="login-card">
  <img src="assets/logo.png" alt="MRIservice" class="login-card__logo">
  <h1 class="login-card__title">Acesso Admin</h1>
  <p class="login-card__subtitle">Entre com sua conta para gerenciar peças, componentes e mensagens de contato.</p>

  <form id="loginForm" class="login-form">
    <div class="contact-form__field">
      <label class="contact-form__label" for="login-email">E-mail</label>
      <input class="contact-form__input" type="email" id="login-email" name="email" placeholder="voce@mriservice.com" required>
    </div>

    <div class="contact-form__field">
      <label class="contact-form__label" for="login-password">Senha</label>
      <input class="contact-form__input" type="password" id="login-password" name="password" placeholder="••••••••" required>
    </div>

    <p class="login-form__error" id="loginError" hidden></p>

    <button type="submit" class="btn btn--primary login-form__submit">
      Entrar
      <img src="assets/icone-arrow.svg" alt="" class="btn__icon">
    </button>
  </form>

  <a href="index.html" class="login-card__back">← Voltar para o site</a>
</div>

<script src="js/vendor/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/login.js?v=5"></script>
</body>
